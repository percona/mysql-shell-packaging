# Percona patch sources, one line per MySQL Shell series.
#
#   <series>  <compare-url>
#
# The URL must produce a git format-patch mbox (GitHub's ".patch" form of a
# compare between an upstream base and a fork branch). refresh.sh downloads it
# and splits it into <series>/NNNN-*.patch plus a `series` file.
#
# To add support for a new shell series, add a line here and run:
#     ./patches/refresh.sh <series>
#
# To retire an individual patch that upstream has absorbed, comment out its line
# in <series>/series -- do not delete it from the source branch.

9.7  https://github.com/mysql/mysql-shell/compare/9.7...kamil-holubicki:mysql-shell:PS-10413_and_PS-10416_9.7.patch

# 8.4 currently has no Percona patch branch. Builds of 8.4.x therefore ship
# vanilla upstream; add a line here once a branch exists.
